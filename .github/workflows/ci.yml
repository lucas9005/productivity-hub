name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 🔄 Restore Bun cache
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun run install:all

      - name: 🧹 Run formatting check
        run: bun run format:check

      - name: 🧹 Run linting check
        run: bun run lint:check

      - name: 🧪 Run frontend tests
        run: cd apps/frontend && bun run test:ci

      - name: 🧪 Run backend tests
        run: cd apps/backend && bun run test:ci

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: |
            apps/frontend/coverage/lcov.info
            apps/backend/coverage/lcov.info
          flags: frontend,backend
          name: productivity-hub

      - name: 🧾 Build frontend docs
        run: cd apps/frontend && bun run docs

      - name: 🧾 Build backend docs
        run: cd apps/backend && bun run docs
