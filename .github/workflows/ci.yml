name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  check-format-lint:
    name: 🔍 Check Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Setup Environment
        uses: ./.github/actions/setup-env

      - name: 🔍 Check Format
        run: bun run format:check

      - name: 🔍 Check Lint
        run: bun run lint:check

  unit-test-frontend:
    name: 🧪 Unit Test Frontend
    runs-on: ubuntu-latest
    needs: check-format-lint
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Setup Environment
        uses: ./.github/actions/setup-env

      - name: 🧪 Unit Test
        run: cd apps/frontend && bun run test:unit:ci

      - name: 💾 Store Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-frontend-coverage-report
          path: apps/frontend/coverage/lcov.info
          retention-days: 7

  e2e-test-frontend:
    name: 🧪 E2E Test Frontend
    runs-on: ubuntu-latest
    needs: check-format-lint
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Setup Environment
        uses: ./.github/actions/setup-env

      - name: 📦 Install Playwright Dependencies
        run: cd apps/frontend && bun x playwright install --with-deps

      - name: 🧪 E2E Test
        run: cd apps/frontend && bun run test:e2e:ci

      - name: 💾 Store Failed Execution Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-frontend-failed-execution-results
          path: apps/frontend/playwright/
          retention-days: 7

  unit-test-backend:
    name: 🧪 Unit Test Backend
    runs-on: ubuntu-latest
    needs: check-format-lint
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Setup Environment
        uses: ./.github/actions/setup-env

      - name: 🧪 Unit Test
        run: cd apps/backend && bun run test:ci

      - name: 💾 Store Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-backend-coverage-report
          path: apps/backend/coverage/lcov.info
          retention-days: 7

  upload-unit-coverage-reports:
    name: 📤 Upload Unit Coverage Reports
    runs-on: ubuntu-latest
    needs: [unit-test-frontend, unit-test-backend]
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Setup Environment
        uses: ./.github/actions/setup-env

      - name: 📥 Download Frontend Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: unit-test-frontend-coverage-report
          path: apps/frontend/coverage/

      - name: 📥 Download Backend Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: unit-test-backend-coverage-report
          path: apps/backend/coverage/

      - name: 📂 Validate Coverage Reports
        run: |
          test -f apps/frontend/coverage/lcov.info
          test -f apps/backend/coverage/lcov.info

      - name: 📤 Upload Coverage Reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: |
            apps/frontend/coverage/lcov.info
            apps/backend/coverage/lcov.info
          flags: frontend,backend
          name: productivity-hub

  build-frontend:
    name: 🧾 Build Frontend
    runs-on: ubuntu-latest
    needs: unit-test-frontend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Setup Environment
        uses: ./.github/actions/setup-env

      - name: ♻️ Rename prod sample env file
        run: mv apps/frontend/src/environments/environment.prod.sample.ts apps/frontend/src/environments/environment.prod.ts

      - name: 🧾 Build Frontend
        run: cd apps/frontend && bun run build:prod

  build-backend:
    name: 🧾 Build Backend
    runs-on: ubuntu-latest
    needs: unit-test-backend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Setup Environment
        uses: ./.github/actions/setup-env

      - name: 🧾 Build Backend
        run: cd apps/backend && bun run build:prod

  build-docs:
    name: 🧾 Build Docs
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Setup Environment
        uses: ./.github/actions/setup-env

      - name: 🧾 Build Frontend Docs
        run: cd apps/frontend && bun run docs:build

      - name: 🧾 Build Backend Docs
        run: cd apps/backend && bun run docs:build
